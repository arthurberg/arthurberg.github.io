name: Quarto Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize Pages deploys: deploy-pages fails if a second deployment starts
# while one is in flight. Never cancel in progress — a cancelled deploy can
# leave the Pages environment half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Verify generated pages are in sync with their sources
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            'bibtexparser<2' 'PyYAML>=6.0'
          python3 scripts/gen_research.py
          python3 scripts/gen_publications.py
          git diff --exit-code -- _research-body.qmd publications.qmd _publications-body.qmd \
            || { echo '::error::Generated pages are stale. Run scripts/gen_research.py and scripts/gen_publications.py, then commit the result.'; exit 1; }

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so a deploy never silently changes the bundled search/JS/CSS.
          # This is the version that built the current live site; bump it in a
          # commit of its own after checking the rendered output.
          version: 1.9.38

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
